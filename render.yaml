services:
  - type: web
    name: roletrace
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: roletrace-db
          property: connectionString
databases:
  - name: roletrace-db
    plan: free
    databaseName: roletrace
    user: roletrace
